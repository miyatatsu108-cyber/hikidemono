<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宮川家・池田家 引出物のご案内</title>
  <style>
    :root {
      --primary-color: #7a8b7b;
      --bg-color: #faf9f6;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px 10px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 8px;
    }
    p.sub {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 25px;
    }
    
    /* 商品カードのデザイン */
    .item-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      background: #fff;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .item-card:hover {
      border-color: var(--primary-color);
      background-color: #fcfdfc;
    }
    .item-card input[type="radio"] {
      margin-top: 5px;
      margin-right: 12px;
      transform: scale(1.3);
      flex-shrink: 0;
    }
    .item-content {
      flex-grow: 1;
    }
    .item-image {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
      background-color: #eee;
    }
    .item-title {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 4px;
      color: #222;
    }
    .item-desc {
      font-size: 0.82rem;
      color: #666;
      line-height: 1.4;
    }

    /* フォーム入力欄 */
    .input-group {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    .field-block {
      margin-bottom: 18px;
    }
    label.input-label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .sub-label {
      font-size: 0.82rem;
      color: #666;
      font-weight: normal;
      margin-top: -4px;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* 注意書きエリア */
    .notice-box {
      margin-top: 12px;
      padding: 10px 12px;
      background-color: #f7f7f7;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #555555;
      line-height: 1.6;
    }
    .notice-box p {
      margin: 0;
    }

    button.submit-btn {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 15px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 20px;
      cursor: pointer;
    }
    #completion-message {
      display: none;
      text-align: center;
      padding: 40px 10px;
    }
  </style>
</head>
<body>

<div class="container" id="form-container">
  <h1>宮川家・池田家 引出物のご案内</h1>
  <p class="sub">以下よりお好みの品を1つお選びいただき、お名前をご入力の上送信してください。</p>

  <form id="gift-form">
    <div class="item-list">

      <!-- 商品1 -->
      <label class="item-card">
        <input type="radio" name="item" value="01. 貴方のためのFEILERハンカチーフ" required>
        <div class="item-content">
          <img src="https://feiler.jp/img/goods/L/2F0623012525_50_24.jpg" alt="商品画像" class="item-image">
          <div class="item-title">01. 貴方のためのFEILERハンカチーフ</div>
          <div class="item-desc">私たちが貴方のイメージに合うモチーフのFEILERハンカチーフを選びます。</div>
        </div>
      </label>

      <!-- 商品2 -->
      <label class="item-card">
        <input type="radio" name="item" value="02. 蔵前のコーヒー・焼き菓子セット" required>
        <div class="item-content">
          <img src="1c94f72f0f4ee44cb85ecebbfa813224.jpg" alt="商品画像" class="item-image">
          <div class="item-title">02. 蔵前のコーヒー・焼き菓子セット</div>
          <div class="item-desc">私たちの居住地である蔵前のカフェ「コフィノワ」のコーヒー豆と、パティスリー「シノノメ菓子店」の焼き菓子のセットです。</div>
        </div>
      </label>

      <!-- 商品3 -->
      <label class="item-card">
        <input type="radio" name="item" value="03. 茅乃舎 出汁セット" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+03" alt="商品画像" class="item-image">
          <div class="item-title">03. 茅乃舎 出汁セット</div>
          <div class="item-desc">茅乃舎のオススメ出汁セットです。野菜だしと和風だしが美味しい。</div>
        </div>
      </label>

      <!-- 商品4 -->
      <label class="item-card">
        <input type="radio" name="item" value="04. TENERITA フェイスタオル" required>
        <div class="item-content">
          <img src="download_004f14a5-8e0d-4525-8ef8-dab6e8fb9570.jpg" alt="商品画像" class="item-image">
          <div class="item-title">04. TENERITA フェイスタオル</div>
          <div class="item-desc">私たちも愛用するTENERITAのフェイスタオル。家のタオルを全てTENERITAにしたくなります。</div>
        </div>
      </label>

      <!-- 商品5 -->
      <label class="item-card">
        <input type="radio" name="item" value="05. ヘアケア系（早希）" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+05" alt="商品画像" class="item-image">
          <div class="item-title">05. ヘアケア系（早希）</div>
          <div class="item-desc">早希ちゃんのオススメヘアケアグッズ</div>
        </div>
      </label>

      <!-- 商品6 -->
      <label class="item-card">
        <input type="radio" name="item" value="06. 八代目儀兵衛 厳選お米セット" required>
        <div class="item-content">
          <img src="gi-t25_slide01.jpg" alt="商品画像" class="item-image">
          <div class="item-title">06. 八代目儀兵衛 ブランドお米・海苔セット</div>
          <div class="item-desc">京都の有名精米店「八代目儀兵衛」のお米と海苔のセットです。ちなみに新婦は京都が大好き。</div>
        </div>
      </label>

      <!-- 商品7 -->
      <label class="item-card">
        <input type="radio" name="item" value="07. 飛田柑橘園 柑橘オリーブオイルセット" required>
        <div class="item-content">
          <img src="IMG-5241-3.jpg" alt="商品画像" class="item-image">
          <div class="item-title">07. 飛田柑橘園 柑橘オリーブオイルセット</div>
          <div class="item-desc">湯河原で出会った柑橘が香るオリーブオイルです。醤油と合わせてお刺身につけると絶品。</div>
        </div>
      </label>

      <!-- 商品8 -->
      <label class="item-card">
        <input type="radio" name="item" value="08. 化粧品系（早希）" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+08" alt="商品画像" class="item-image">
          <div class="item-title">08. 化粧品系（早希）</div>
          <div class="item-desc">早希ちゃんのオススメ化粧品。</div>
        </div>
      </label>

      <!-- 商品9 -->
      <label class="item-card">
        <input type="radio" name="item" value="09. OSAJIコンディショニングセット" required>
        <div class="item-content">
          <img src="1786151628050.jpg" alt="商品画像" class="item-image">
          <div class="item-title">09. OSAJIコンディショニングセット</div>
          <div class="item-desc">新郎オススメの、OSAJIの美容液とクレイパックのセット。メンズにもオススメです。</div>
        </div>
      </label>

      <!-- 商品10 -->
      <label class="item-card">
        <input type="radio" name="item" value="10. カタログギフト" required>
        <div class="item-content">          
          <div class="item-title">10. カタログギフト</div>
          <div class="item-desc">グルメや雑貨からお好きな一品をお選びいただけるカタログギフトです。</div>
        </div>
      </label>

    </div>

    <div class="input-group">
      <div class="field-block">
        <label class="input-label" for="guest_name">お名前（フルネーム）</label>
        <input type="text" id="guest_name" name="guest_name" placeholder="例：山田 太郎" required>
      </div>

      <div class="field-block">
        <label class="input-label" for="guest_email">メールアドレス（任意：控え送信用）</label>
        <input type="email" id="guest_email" name="guest_email" placeholder="例：example@email.com">
      </div>

      <div class="field-block">
        <label class="input-label" for="notes">備考・ご要望（任意）</label>
        <div class="sub-label">引出物に関しての連絡事項があれば記載ください（例：コーヒーは豆のままを希望等）</div>
        <textarea id="notes" name="notes" placeholder="自由にご記入ください"></textarea>
      </div>
      
      <div class="notice-box">
        <p>※回答期限は10月19日23時59分とさせていただきます。</p>
        <p>※期限までに未回答の場合、10.カタログギフトを準備させていただきます。</p>
        <p>※同一氏名で複数回回答がある場合は、最新の回答結果に基づき準備させていただきます。</p>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">決定して送信する</button>
  </form>
</div>

<div class="container" id="completion-message">
  <h2>ご回答ありがとうございました</h2>
  <p>回答結果を送信いたしました。</p>
  <p style="font-size: 0.85rem; color: #666; margin-top: 10px;">メールアドレスを入力された方には、選択内容の控えメールをお送りしております。</p>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwLpgu_HZ5AggKA9_D4sSE8bt0Q3Xn40UOFWi-rKJxCbEjJDlDCIH4rXglzLZm7wctA/exec";

  const form = document.getElementById('gift-form');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';

    const formData = new FormData(form);

    fetch(GAS_URL, {
      method: 'POST',
      body: formData,
      mode: 'no-cors'
    })
    .then(() => {
      document.getElementById('form-container').style.display = 'none';
      document.getElementById('completion-message').style.display = 'block';
    })
    .catch(error => {
      console.error('Error:', error);
      alert('通信エラーが発生しました。');
      submitBtn.disabled = false;
      submitBtn.textContent = '決定して送信する';
    });
  });
</script>

</body>
</html>
