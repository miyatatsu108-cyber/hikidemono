<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宮川家・池田家 結婚披露宴 引出物のご案内</title>
  <style>
    :root {
      --primary-color: #7a8b7b;
      --bg-color: #faf9f6;
      --card-bg: #ffffff;
      --text-color: #333333;
    }
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px 10px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 8px;
    }
    p.sub {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 25px;
    }
    
    /* 商品カードのデザイン */
    .item-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      background: #fff;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .item-card:hover {
      border-color: var(--primary-color);
      background-color: #fcfdfc;
    }
    .item-card input[type="radio"] {
      margin-top: 5px;
      margin-right: 12px;
      transform: scale(1.3);
      flex-shrink: 0;
    }
    .item-content {
      flex-grow: 1;
    }
    .item-image {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
      background-color: #eee;
    }
    .item-title {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 4px;
      color: #222;
    }
    .item-desc {
      font-size: 0.82rem;
      color: #666;
      line-height: 1.4;
    }

    /* フォーム入力欄 */
    .input-group {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    .field-block {
      margin-bottom: 18px;
    }
    label.input-label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    /* 注意書きエリア */
    .notice-box {
      margin-top: 12px;
      padding: 10px 12px;
      background-color: #f7f7f7;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #555555;
      line-height: 1.6;
    }
    .notice-box p {
      margin: 0;
    }

    button.submit-btn {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 15px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 20px;
      cursor: pointer;
    }
    #completion-message {
      display: none;
      text-align: center;
      padding: 40px 10px;
    }
  </style>
</head>
<body>

<div class="container" id="form-container">
  <h1>引出物のご案内</h1>
  <p class="sub">以下よりお好みの品を1つお選びいただき、お名前をご入力の上送信してください。</p>

  <form id="gift-form">
    <div class="item-list">

      <!-- 商品1 -->
      <label class="item-card">
        <input type="radio" name="item" value="01. 新婦が選ぶ貴方のためのFEILERハンカチーフ" required>
        <div class="item-content">
          <img src="https://feiler.jp/img/goods/L/2F0623012525_50_24.jpg" alt="商品画像" class="item-image">
          <div class="item-title">01. 新婦が選ぶ貴方のためのFEILERハンカチーフ</div>
          <div class="item-desc">新婦が貴方のイメージに合った柄のFEILERハンカチーフを選びます。※新郎がイメージ共有をするので新郎側参列者もお選びいただけます</div>
        </div>
      </label>

      <!-- 商品2 -->
      <label class="item-card">
        <input type="radio" name="item" value="02. ウッドプレートセット" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+02" alt="商品画像" class="item-image">
          <div class="item-title">02. ウッドプレートセット</div>
          <div class="item-desc">温かみのある天然木を使用した朝食に最適なプレートです。</div>
        </div>
      </label>

      <!-- 商品3 -->
      <label class="item-card">
        <input type="radio" name="item" value="03. オーガニックタオルセット" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+03" alt="商品画像" class="item-image">
          <div class="item-title">03. オーガニックタオルセット</div>
          <div class="item-desc">上質な肌触りと高い吸水性を備えたプレミアムタオルです。</div>
        </div>
      </label>

      <!-- 商品4 -->
      <label class="item-card">
        <input type="radio" name="item" value="04. カトラリーセット" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+04" alt="商品画像" class="item-image">
          <div class="item-title">04. カトラリーセット</div>
          <div class="item-desc">洗練されたデザインで食卓を上品に彩るセットです。</div>
        </div>
      </label>

      <!-- 商品5 -->
      <label class="item-card">
        <input type="radio" name="item" value="05. 卓上加湿器" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+05" alt="商品画像" class="item-image">
          <div class="item-title">05. 卓上加湿器</div>
          <div class="item-desc">デスクや寝室で活躍するコンパクトで静音設計の加湿器です。</div>
        </div>
      </label>

      <!-- 商品6 -->
      <label class="item-card">
        <input type="radio" name="item" value="06. アロマディフューザー" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+06" alt="商品画像" class="item-image">
          <div class="item-title">06. アロマディフューザー</div>
          <div class="item-desc">心地よい香りでリラックス空間を演出するアロマセットです。</div>
        </div>
      </label>

      <!-- 商品7 -->
      <label class="item-card">
        <input type="radio" name="item" value="07. ドリップコーヒー＆焼き菓子" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+07" alt="商品画像" class="item-image">
          <div class="item-title">07. ドリップコーヒー＆焼き菓子</div>
          <div class="item-desc">厳選されたコーヒー豆と相性抜群のスイーツのアソートです。</div>
        </div>
      </label>

      <!-- 商品8 -->
      <label class="item-card">
        <input type="radio" name="item" value="08. 高級紅茶アソート" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+08" alt="商品画像" class="item-image">
          <div class="item-title">08. 高級紅茶アソート</div>
          <div class="item-desc">芳醇な香りと豊かな味わいを楽しめる茶葉の詰合せです。</div>
        </div>
      </label>

      <!-- 商品9 -->
      <label class="item-card">
        <input type="radio" name="item" value="09. OSAJI メンズコンディショニングセット" required>
        <div class="item-content">
          <img src="1786096667044.jpg" alt="商品画像" class="item-image">
          <div class="item-title">09. OSAJI メンズコンディショニングセット</div>
          <div class="item-desc">新郎が愛用している美容液とクレイパックのセットです。</div>
        </div>
      </label>

      <!-- 商品10 -->
      <label class="item-card">
        <input type="radio" name="item" value="10. カタログギフト" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+10" alt="商品画像" class="item-image">
          <div class="item-title">10. カタログギフト</div>
          <div class="item-desc">全国のグルメや雑貨からお好きな一品をお選びいただけます。</div>
        </div>
      </label>

    </div>

    <div class="input-group">
      <div class="field-block">
        <label class="input-label" for="guest_name">お名前（フルネーム）</label>
        <input type="text" id="guest_name" name="guest_name" placeholder="例：山田 太郎" required>
      </div>

      <div class="field-block">
        <label class="input-label" for="guest_email">メールアドレス（任意：控え送信用）</label>
        <input type="email" id="guest_email" name="guest_email" placeholder="例：example@email.com">
      </div>
      
      <div class="notice-box">
        <p>※回答期限は10月19日23時59分とさせていただきます。</p>
        <p>※期限までに未回答の場合、10.カタログギフトを準備させていただきます。</p>
        <p>※同一氏名で複数回回答がある場合は、最新の回答結果に基づき準備させていただきます。</p>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">決定して送信する</button>
  </form>
</div>

<div class="container" id="completion-message">
  <h2>ご回答ありがとうございました</h2>
  <p>選択結果を送信いたしました。</p>
  <p style="font-size: 0.85rem; color: #666; margin-top: 10px;">メールアドレスを入力された方には、選択内容の控えメールをお送りしております。</p>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzf4RxLjz6slkZkkUxiUAed8y92I67vN8BZdEL84lLYdb10bkFYmQQGlY83Vbmh9apq/exec";

  const form = document.getElementById('gift-form');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';

    const formData = new FormData(form);

    fetch(GAS_URL, {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.result === 'success') {
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('completion-message').style.display = 'block';
      } else {
        alert('エラーが発生しました。');
        submitBtn.disabled = false;
        submitBtn.textContent = '決定して送信する';
      }
    })
    .catch(error => {
      console.error('Error:', error);
      alert('通信エラーが発生しました。');
      submitBtn.disabled = false;
      submitBtn.textContent = '決定して送信する';
    });
  });
</script>

</body>
</html>
