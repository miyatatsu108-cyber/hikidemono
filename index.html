<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宮川家・池田家 引出物のご案内</title>

  <!-- Google Fonts: 高級感のある「Shippori Mincho」を読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* アピアランス：アンダーズ東京×くすみクリスマスのカラーパレット */
      --primary-color: #7d3c45;      /* 深みのあるシックなボルドー */
      --primary-hover: #632d35;      /* ホバー時の濃いボルドー */
      --accent-green: #526353;       /* くすみセージグリーン */
      --bg-color: #f7f5f2;           /* アイボリー・ウォームグレー */
      --card-bg: #ffffff;
      --text-color: #2b2b2b;          /* 墨色 */
      --border-color: #e5dfd8;        /* ニュートラルベージュ */
    }

    body {
      font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 25px 12px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border-color);
    }

    /* タイトルの改行を防ぐためフォントサイズを1.25remに調整 */
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      color: var(--primary-color);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 1.1rem;
      }
    }

    p.sub {
      text-align: center;
      font-size: 0.82rem;
      color: #666;
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }
    
    /* 商品カードのデザイン */
    .item-card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      background: #fff;
      transition: all 0.25s ease;
      position: relative;
    }

    .item-card:hover {
      border-color: var(--accent-green);
      background-color: #fafdff;
      box-shadow: 0 4px 12px rgba(82, 99, 83, 0.08);
      transform: translateY(-2px);
    }

    .item-card input[type="radio"] {
      margin-top: 6px;
      margin-right: 12px;
      transform: scale(1.3);
      flex-shrink: 0;
      accent-color: var(--primary-color);
    }

    .item-content {
      flex-grow: 1;
    }

    .item-image {
      width: 100%;
      max-height: 190px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
      background-color: #f2efe9;
    }

    /* 商品タグのスタイルベース */
    .item-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .tag {
      font-size: 0.7rem;
      padding: 3px 9px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* タグのカラーバリエーション定義 */
    .tag-bordeaux {
      background-color: #f7ebeb !important;
      color: #7d3c45 !important;
    }

    .tag-pink {
      background-color: #fcebeb !important;
      color: #a84b5c !important; /* ウィメンズ向け */
    }

    .tag-blue {
      background-color: #eaf1f7 !important;
      color: #3b5f7e !important; /* 新郎のオススメ・メンズ向け */
    }

    .tag-gold {
      background-color: #f7f2e7 !important;
      color: #8c734b !important; /* 新郎新婦の愛用品・Andaz限定 */
    }

    .tag-gray {
      background-color: #f0ece6 !important;
      color: #5d5955 !important; /* カテゴリタグ用 */
    }

    .item-title {
      font-weight: 600;
      font-size: 1.02rem;
      margin-bottom: 6px;
      color: var(--text-color);
      letter-spacing: 0.02em;
    }

    .item-desc {
      font-size: 0.82rem;
      color: #666;
      line-height: 1.5;
    }

    /* フォーム入力欄 */
    .input-group {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid var(--border-color);
    }

    .field-block {
      margin-bottom: 22px;
    }

    label.input-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--primary-color);
    }

    .sub-label {
      font-size: 0.8rem;
      color: #666;
      font-weight: normal;
      margin-top: -4px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
      font-family: inherit;
      background-color: #fcfbf9;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-green);
      background-color: #ffffff;
    }

    textarea {
      resize: vertical;
      min-height: 85px;
    }

    /* 注意書きエリア */
    .notice-box {
      margin-top: 15px;
      padding: 12px 14px;
      background-color: #f3f5f3;
      border-left: 3px solid var(--accent-green);
      border-radius: 4px;
      font-size: 0.78rem;
      color: #4a544b;
      line-height: 1.6;
    }

    .notice-box p {
      margin: 0;
    }

    /* ボタン */
    button.submit-btn {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.08em;
      border-radius: 30px;
      margin-top: 25px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(125, 60, 69, 0.2);
      transition: background-color 0.25s, transform 0.15s, box-shadow 0.25s;
    }

    button.submit-btn:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(125, 60, 69, 0.3);
      transform: translateY(-1px);
    }

    #completion-message {
      display: none;
      text-align: center;
      padding: 50px 10px;
    }

    #completion-message h2 {
      color: var(--primary-color);
      font-size: 1.4rem;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="container" id="form-container">
  <h1>宮川家・池田家 引出物のご案内</h1>
  <p class="sub">以下よりお好みの品を1つお選びいただき、お名前・メールアドレス等をご入力の上送信してください。</p>

  <form id="gift-form">
    <div class="item-list">

      <!-- ==================== 1. タオル・ハンカチ ==================== -->
      <!-- 商品1 -->
      <label class="item-card">
        <input type="radio" name="item" value="01. 貴方のためのFEILERハンカチ" required>
        <div class="item-content">
          <img src="images~2.jpeg" alt="商品画像" class="item-image">
          <div class="item-tags">
            <span class="tag tag-gray">タオル・ハンカチ</span>
            <span class="tag tag-bordeaux">新婦のオススメ</span>
          </div>
          <div class="item-title">01. 貴方のためのFEILERハンカチ</div>
          <div class="item-desc">私たちが、貴方のイメージに合うモチーフのFEILERハンカチを選びます。</div>
        </div>
      </label>

      <!-- 商品2 -->
      <label class="item-card">
        <input type="radio" name="item" value="02. 虎ノ門きや おかき8種詰め合わせ" required>
        <div class="item-content">
          <img src="1786877193557.png" alt="商品画像" class="item-image">
          <div class="item-tags">
            <span class="tag tag-gray">グルメ</span>
            <span class="tag tag-gold">新郎新婦の愛用品</span>
          </div>
          <div class="item-title">02. 虎ノ門きや おかき8種詰め合わせ</div>
          <div class="item-desc">虎ノ門の老舗「きや」の、Andazの客室で提供されているおかき。恐ろしいほど美味しくて震えます</div>
        </div>
      </label>

      <!-- ==================== 2. グルメ ==================== -->
      <!-- 商品3 (オリーブオイル先) -->
      <label class="item-card">
        <input type="radio" name="item" value="03. 飛田柑橘園 柑橘オリーブオイル" required>
        <div class="item-content">
          <img src="original~2.jpeg" alt="商品画像" class="item-image">
          <div class="item-tags">
            <span class="tag tag-gray">グルメ</span>
            <span class="tag tag-blue">新郎のオススメ</span>
          </div>
          <div class="item-title">03. 飛田柑橘園 柑橘オリーブオイル</div>
          <div class="item-desc">湯河原で出会った柑橘が香るオリーブオイルです。醤油と合わせてお刺身につけると絶品。</div>
        </div>
      </label>

      <!-- 商品4 (お米次) -->
      <label class="item-card">
        <input type="radio" name="item" value="04. 八代目儀兵衛 お米・海苔セット" required>
        <div class="item-content">
          <img src="Screenshot_20260816-201334.png" alt="商品画像" class="item-image">
          <div class="item-tags">
            <span class="tag tag-gray">グルメ</span>
            <span class="tag tag-gold">日持ち◎</span>
          </div>
          <div class="item-title">04. 八代目儀兵衛 お米・カレーセット</div>
          <div class="item-desc">京都の有名店「八代目儀兵衛」のお米とカレーセット。新婦は京都とカレーに縁があります。</div>
        </div>
      </label>

      <!-- ==================== 3. カフェ・スイーツ ==================== -->
      <!-- 商品5 -->
      <label class="item-card">
        <input type="radio" name="item" value="05. 蔵前コーヒー・焼き菓子セット" required>
        <div class="item-content">
          <img src="1786421420437.png" alt="商品画像" class="item-image">
          <div class="item-tags">
            <span class="tag tag-gray">カフェ・スイーツ</span>
            <span class="tag tag-gold">新郎新婦の愛用品</span>
          </div>
          <div class="item-title">05. 蔵前コーヒー・焼き菓子セット</div>
          <div class="item-desc">私たちの居住地である蔵前のカフェ「コフィノワ」のコーヒー豆と、パティスリー「菓子屋シノノメ」の焼き菓子のセットです。</div>
        </div>
      </label>

      <!-- ==================== 4. フレグランス ==================== -->
      <!-- 商品6 -->
      <label class="item-card">
        <input type="radio" name="item" value="06. Andaz ルームフレグランス" required>
        <div class="item-content">
          <img src="380de61be31bc39f7e06aa2ee396ba81-scaled.jpg" alt="商品画像" class="item-image">
          <div class="item-tags">
            <span class="tag tag-gray">フレグランス</span>
            <span class="tag tag-gold">新郎新婦の愛用品</span>
          </div>
          <div class="item-title">06. Andaz ルームフレグランス</div>
          <div class="item-desc">Andazでは、春は「さくら」、夏は「竹」、秋は「稲穂」、冬は「柚子」の香りが使用されており、ご希望の香りを選択いただけます（おまかせも可能）。</div>
        </div>
      </label>

      <!-- ==================== 5. 美容アイテム ==================== -->
      <!-- 商品7 -->
      <label class="item-card">
        <input type="radio" name="item" value="07. ヘアケア系（早希）" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+05" alt="商品画像" class="item-image">
          <div class="item-tags">
            <span class="tag tag-gray">美容アイテム</span>
            <span class="tag tag-pink">ウィメンズ向け</span>
          </div>
          <div class="item-title">07. ヘアケア系（早希）</div>
          <div class="item-desc">早希ちゃんのオススメヘアケアグッズ</div>
        </div>
      </label>

      <!-- 商品8 -->
      <label class="item-card">
        <input type="radio" name="item" value="08. 化粧品系（早希）" required>
        <div class="item-content">
          <img src="https://via.placeholder.com/400x200?text=Item+08" alt="商品画像" class="item-image">
          <div class="item-tags">
            <span class="tag tag-gray">美容アイテム</span>
            <span class="tag tag-pink">ウィメンズ向け</span>
          </div>
          <div class="item-title">08. 化粧品系（早希）</div>
          <div class="item-desc">早希ちゃんのオススメ化粧品。</div>
        </div>
      </label>

      <!-- 商品9 -->
      <label class="item-card">
        <input type="radio" name="item" value="09. OSAJI美容液・パックセット" required>
        <div class="item-content">
          <img src="1786151628050.jpg" alt="商品画像" class="item-image">
          <div class="item-tags">
            <span class="tag tag-gray">美容アイテム</span>
            <span class="tag tag-blue">メンズ向け</span>
          </div>
          <div class="item-title">09. OSAJI美容液・パックセット</div>
          <div class="item-desc">新郎オススメの、OSAJIの美容液とクレイパックのセット。メンズに特にオススメです。</div>
        </div>
      </label>

      <!-- ==================== 6. 定番 ==================== -->
      <!-- 商品10 -->
      <label class="item-card">
        <input type="radio" name="item" value="10. カタログギフト" required>
        <div class="item-content">          
          <div class="item-tags">
            <span class="tag tag-gray">定番</span>
            <span class="tag tag-gray">選択自由</span>
          </div>
          <div class="item-title">10. カタログギフト</div>
          <div class="item-desc">グルメや雑貨からお好きな一品をお選びいただけるカタログギフトです。</div>
        </div>
      </label>

    </div>

    <div class="input-group">
      <div class="field-block">
        <label class="input-label" for="guest_name">お名前（フルネーム）</label>
        <input type="text" id="guest_name" name="guest_name" placeholder="例：山田 太郎" required>
      </div>

      <div class="field-block">
        <label class="input-label" for="guest_email">メールアドレス（任意：控え送信用）</label>
        <input type="email" id="guest_email" name="guest_email" placeholder="例：example@email.com">
      </div>

      <div class="field-block">
        <label class="input-label" for="notes">備考・ご要望（任意）</label>
        <div class="sub-label">引出物に関しての連絡事項があれば記載ください（例：コーヒーは豆のままを希望）</div>
        <textarea id="notes" name="notes" placeholder="自由にご記入ください"></textarea>
      </div>
      
      <div class="notice-box">
        <p>※回答期限は10月19日23時59分とさせていただきます。</p>
        <p>※期限までに未回答の場合、10.カタログギフトを準備させていただきます。</p>
        <p>※同一氏名で複数回回答がある場合は、最新の回答結果に基づき準備させていただきます。</p>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">決定して送信する</button>
  </form>
</div>

<div class="container" id="completion-message">
  <h2>ご回答ありがとうございました</h2>
  <p>回答結果を送信いたしました。</p>
  <p style="font-size: 0.85rem; color: #666; margin-top: 10px;">メールアドレスを入力された方には、選択内容の控えメールをお送りしております。</p>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwLpgu_HZ5AggKA9_D4sSE8bt0Q3Xn40UOFWi-rKJxCbEjJDlDCIH4rXglzLZm7wctA/exec";

  const form = document.getElementById('gift-form');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';

    const formData = new FormData(form);

    fetch(GAS_URL, {
      method: 'POST',
      body: formData,
      mode: 'no-cors'
    })
    .then(() => {
      document.getElementById('form-container').style.display = 'none';
      document.getElementById('completion-message').style.display = 'block';
    })
    .catch(error => {
      console.error('Error:', error);
      alert('通信エラーが発生しました。');
      submitBtn.disabled = false;
      submitBtn.textContent = '決定して送信する';
    });
  });
</script>

</body>
</html>
